name: Bug
description: Un defecto reproducible en el frontend.
title: '[Bug] '
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasa
      description: Comportamiento observado vs. esperado.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Pasos para reproducir
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Entorno
      description: 'navegador / SO / rama / commit'
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia
      description: Logs de consola, screenshots, salida de tests.
