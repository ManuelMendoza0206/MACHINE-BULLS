[project]
name = "styleme-backend"
version = "0.1.0"
description = "StyleMe backend — FastAPI + SQLAlchemy"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "psycopg[binary]>=3.1",
  "supabase>=2.4",
  "mlflow>=3.16.1",
  "psutil>=7.2.2",
  "pyngrok>=8.1.2",
  "pyyaml>=6.0.3",
  # --- dependencias del MVP (analisis + VTON) ---
  "pillow>=10.0",
  "numpy>=2.0",
  # subida de archivos multipart (upload de prendas)
  "python-multipart>=0.0.9",
  # cliente HTTP en runtime: Replicate VTON y futuras llamadas a APIs
  "httpx>=0.27",
  # cola de jobs VTON (spec 4.1.8): ARQ sobre Redis
  "arq[redis]>=0.26",
  # CLIP local (CPU). Para instalar torch sin CUDA:
  #   uv pip install torch --index-url https://download.pytorch.org/whl/cpu
  # transformers solo se importa de forma perezosa (ver ml.models.clip_classifier).
  "transformers>=4.44",
  # Validacion A-Pose del protocolo de entrada (4.1.5): pose_check.
  "mediapipe>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests", "src/ml"]
pythonpath = ["src"]

[dependency-groups]
# Un solo grupo dev. Antes convivían `[project.optional-dependencies].dev`
# (pytest, ruff) y `[dependency-groups].dev` (ipykernel), y `uv sync --extra dev`
# y `uv sync --group dev` daban-installed cosas distintas. El CI usa este grupo.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.3",
    "httpx>=0.27",
    # Los notebooks corren en Colab con su propio runtime; se incluye acá para
    # que `uv run jupyter` funcione local sin instalar a mano.
    "ipykernel>=7.3.0",
]
