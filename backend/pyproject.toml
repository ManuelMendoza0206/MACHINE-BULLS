[project]
name = "styleme-backend"
version = "0.1.0"
description = "StyleMe backend — FastAPI + SQLAlchemy"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "psycopg[binary]>=3.1",
  "supabase>=2.4",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.3"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests", "src/ml"]
pythonpath = ["src"]
