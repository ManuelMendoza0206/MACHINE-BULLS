[alembic]
script_location = alembic
# La URL real viene de env (DATABASE_URL) en env.py; esto es solo placeholder.
sqlalchemy.url = postgresql://postgres:postgres@127.0.0.1:54322/postgres

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
