services:
  db:
    image: pgvector/pgvector:pg16
    container_name: styleme-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: styleme
      POSTGRES_USER: styleme
      POSTGRES_PASSWORD: styleme_mvp
    ports:
      - "5432:5432"
    volumes:
      - styleme-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U styleme -d styleme"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  styleme-pgdata:
