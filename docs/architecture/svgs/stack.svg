<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#f8fafc"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Stack del MVP — compose + GPU nativa del host (modo A)</text>

  <!-- zona compose: todo lo containerizado -->
  <rect x="20" y="48" width="640" height="292" rx="12" fill="none" stroke="#2563eb" stroke-dasharray="7 5" stroke-width="1.6"/>
  <text x="34" y="68" font-size="12" font-weight="600" fill="#2563eb">docker compose -f infra/docker-compose.yml  (modo demo: infra/.env → VTON_PROVIDER=catvton)</text>

  <!-- fila 1 -->
  <rect x="40" y="80" width="130" height="48" rx="9" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="105" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">Navegador</text>
  <text x="105" y="116" text-anchor="middle" font-size="10" fill="#475569">usuario</text>

  <rect x="230" y="80" width="170" height="48" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="315" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">frontend :3000</text>
  <text x="315" y="116" text-anchor="middle" font-size="10" fill="#475569">Next.js (contenedor)</text>

  <rect x="460" y="80" width="190" height="48" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="555" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">backend :8000</text>
  <text x="555" y="113" text-anchor="middle" font-size="10" fill="#475569">FastAPI + CLIP + MediaPipe</text>

  <line x1="170" y1="104" x2="228" y2="104" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="400" y1="104" x2="458" y2="104" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="429" y="96" text-anchor="middle" font-size="9" fill="#475569">REST</text>

  <!-- fila 2: workers/almacen -->
  <rect x="40" y="176" width="150" height="52" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="115" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">Postgres :5432</text>
  <text x="115" y="212" text-anchor="middle" font-size="10" fill="#475569">pgvector · jobs · prendas</text>

  <rect x="230" y="176" width="170" height="52" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="315" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">Redis :6379</text>
  <text x="315" y="212" text-anchor="middle" font-size="10" fill="#475569">cola ARQ (spec 4.1.8)</text>

  <rect x="440" y="176" width="210" height="52" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="545" y="194" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">worker ARQ (contenedor)</text>
  <text x="545" y="208" text-anchor="middle" font-size="10" fill="#475569">misma imagen · max_jobs=1</text>
  <text x="545" y="221" text-anchor="middle" font-size="10" fill="#475569">GPU serial</text>

  <line x1="555" y1="128" x2="555" y2="174" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="440" y1="202" x2="402" y2="202" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="421" y="194" text-anchor="middle" font-size="9" fill="#475569">consume</text>

  <!-- volumen compartido -->
  <rect x="40" y="268" width="360" height="52" rx="9" fill="#fdf2f8" stroke="#db2777" stroke-width="1.3"/>
  <text x="220" y="288" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">volumen styleme-media (compartido)</text>
  <text x="220" y="304" text-anchor="middle" font-size="10" fill="#475569">humanos/ prendas/ vton/ — lo sirve el backend</text>
  <line x1="555" y1="228" x2="555" y2="268" stroke="#db2777" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="115" y1="252" x2="115" y2="214" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- host GPU -->
  <rect x="420" y="332" width="240" height="72" rx="12" fill="none" stroke="#f59e0b" stroke-dasharray="7 5" stroke-width="1.6"/>
  <text x="545" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">HOST (fuera de Docker)</text>
  <rect x="440" y="360" width="200" height="36" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="540" y="375" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2937">CatVTON server :7861</text>
  <text x="540" y="389" text-anchor="middle" font-size="9.5" fill="#475569">RTX 4070 · SD-inpainting bf16 · ~50s/capa</text>

  <line x1="545" y1="228" x2="545" y2="330" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="553" y="305" font-size="9.5" fill="#b45309">host.docker.internal:7861</text>

  <text x="340" y="418" text-anchor="middle" font-size="10.5" fill="#64748b">Redis cae → el endpoint cae a BackgroundTasks y la demo sigue (services/queue.py)</text>
</svg>
