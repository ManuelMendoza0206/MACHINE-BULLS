<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="680" height="430" fill="#f8fafc"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Protocolo de entrada — lo que REALMENTE valida hoy el código</text>

  <!-- cliente -->
  <rect x="24" y="52" width="300" height="196" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="174" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Cliente (Next.js, antes de gastar red)</text>
  <circle cx="52" cy="104" r="9" fill="#eff6ff" stroke="#2563eb"/>
  <text x="56" y="109" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">1</text>
  <text x="70" y="101" font-size="11.5" font-weight="600" fill="#1f2937">Blur: varianza laplaciana</text>
  <text x="70" y="116" font-size="9.5" fill="#475569">lib/vision/laplacianVariance.ts</text>
  <text x="70" y="128" font-size="9.5" fill="#475569">imagen borrosa → avisada antes de subir</text>
  <circle cx="52" cy="152" r="9" fill="#eff6ff" stroke="#2563eb"/>
  <text x="56" y="157" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">2</text>
  <text x="70" y="149" font-size="11.5" font-weight="600" fill="#1f2937">Cola de subidas con concurrencia</text>
  <text x="70" y="164" font-size="9.5" fill="#475569">features/garments/lib/uploadQueue.ts</text>
  <text x="70" y="176" font-size="9.5" fill="#475569">lote que excede el techo se encola</text>
  <text x="44" y="222" font-size="9.5" fill="#64748b">guía (no automática aún): prenda sobre fondo liso,</text>
  <text x="44" y="236" font-size="9.5" fill="#64748b">persona frontal — ver docs/context/plan-base.md §2.2</text>

  <!-- servidor -->
  <rect x="356" y="52" width="300" height="196" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="506" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Servidor (FastAPI, garantía real)</text>
  <text x="372" y="100" font-size="11" font-weight="700" fill="#1f2937">A-Pose via MediaPipe (services/pose_check.py)</text>
  <text x="372" y="122" font-size="10.5" fill="#475569">· visibilidad de landmarks ≥ 0.5</text>
  <text x="372" y="140" font-size="10.5" fill="#475569">· brazos 8°–60° del eje vertical (calibrado con</text>
  <text x="380" y="154" font-size="10.5" fill="#475569">la foto canonica del dataset CatVTON)</text>
  <text x="372" y="172" font-size="10.5" fill="#475569">· codos casi rectos (≥ 130°) — atrapa mano</text>
  <text x="380" y="186" font-size="10.5" fill="#475569">en la cadera que oculta la prenda</text>
  <text x="372" y="208" font-size="10.5" fill="#475569">· piernas separadas ≥ 0.04 (ancho normalizado)</text>
  <text x="372" y="232" font-size="9.5" fill="#64748b">POSE_VALIDATION=off desactiva (toggle de tests)</text>

  <!-- rechazo -->
  <rect x="120" y="300" width="440" height="86" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="340" y="326" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">Rechazo = HTTP 422 con motivo ACCIONABLE (nunca error generico)</text>
  <text x="340" y="348" text-anchor="middle" font-size="10.5" fill="#7f1d1d">ej. real del smoke: "codo izquierdo doblado (apoyando la mano?)</text>
  <text x="340" y="364" text-anchor="middle" font-size="10.5" fill="#7f1d1d">dejalo colgado recto; apertura=73"</text>

  <text x="340" y="414" text-anchor="middle" font-size="10" fill="#64748b">validador calibrado: foto canonica model_5 → brazos 9.5–10.8°, codos 168–179° (PASA) · usuario_apose → RECHAZADO</text>
</svg>
