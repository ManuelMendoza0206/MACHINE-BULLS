<svg viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="protocol-title protocol-desc">
  <title id="protocol-title">Protocolo de entrada</title>
  <desc id="protocol-desc">Requisitos de foto de usuario y de prenda, pipeline de validación y feedback de rechazo.</desc>
  <defs>
    <style>
      :root { --primary: #2563eb; --secondary: #7c3aed; --teal: #06b6d4; --success: #10b981; --danger: #ef4444; --text: #1f2937; --gray: #6b7280; --bg: #f9fafb; }
      .card-title { font: 700 13.5px -apple-system, 'Segoe UI', sans-serif; }
      .req { font: 500 11.5px -apple-system, 'Segoe UI', sans-serif; fill: var(--text); }
      .box-title { font: 700 12px -apple-system, 'Segoe UI', sans-serif; fill: #fff; text-anchor: middle; }
      .caption { font: 600 13px -apple-system, 'Segoe UI', sans-serif; fill: var(--text); text-anchor: middle; }
      .arrow { stroke: var(--gray); stroke-width: 2.5; fill: none; marker-end: url(#protocol-arrow); }
      .arrow-danger { stroke: var(--danger); stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#protocol-arrow-danger); }
    </style>
    <marker id="protocol-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="protocol-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="440" fill="var(--bg)"/>

  <!-- Left card: User body photo -->
  <rect x="20" y="20" width="300" height="180" rx="12" fill="#fff" stroke="var(--primary)" stroke-width="2"/>
  <rect x="20" y="20" width="300" height="38" rx="12" fill="var(--primary)"/>
  <rect x="20" y="40" width="300" height="18" fill="var(--primary)"/>
  <text x="170" y="45" text-anchor="middle" class="card-title" fill="#fff">📷 Foto de Cuerpo (Usuario)</text>
  <text x="38" y="82" class="req">• Pose: A-Pose obligatoria</text>
  <text x="38" y="108" class="req">• Fondo: neutro y liso</text>
  <text x="38" y="134" class="req">• Resolución: ≥ 512×512 px</text>
  <text x="38" y="160" class="req">• Iluminación: uniforme, sin sombras fuertes</text>
  <text x="38" y="186" class="req" style="fill:#6b7280">• Formato: JPG / PNG</text>

  <!-- Right card: Garment photo -->
  <rect x="360" y="20" width="300" height="180" rx="12" fill="#fff" stroke="var(--secondary)" stroke-width="2"/>
  <rect x="360" y="20" width="300" height="38" rx="12" fill="var(--secondary)"/>
  <rect x="360" y="40" width="300" height="18" fill="var(--secondary)"/>
  <text x="510" y="45" text-anchor="middle" class="card-title" fill="#fff">👕 Foto de Prenda</text>
  <text x="378" y="82" class="req">• Pose: prenda extendida / plana</text>
  <text x="378" y="108" class="req">• Fondo: blanco o neutro</text>
  <text x="378" y="134" class="req">• Resolución: ≥ 512×512 px</text>
  <text x="378" y="160" class="req">• Iluminación: difusa, sin reflejos</text>
  <text x="378" y="186" class="req" style="fill:#6b7280">• Formato: JPG / PNG</text>

  <path class="arrow" d="M170,200 V220 H255 V236"/>
  <path class="arrow" d="M510,200 V220 H425 V236"/>

  <!-- Pipeline -->
  <text x="340" y="228" class="caption">Pipeline de validación</text>
  <rect x="20" y="240" width="140" height="52" rx="8" fill="var(--teal)"/>
  <text x="90" y="271" class="box-title">Client</text>
  <rect x="180" y="240" width="140" height="52" rx="8" fill="var(--primary)"/>
  <text x="250" y="271" class="box-title">Server</text>
  <rect x="340" y="240" width="140" height="52" rx="8" fill="var(--secondary)"/>
  <text x="410" y="271" class="box-title">Preprocessing</text>
  <rect x="500" y="240" width="140" height="52" rx="8" fill="var(--success)"/>
  <text x="570" y="271" class="box-title">Acceptance</text>

  <path class="arrow" d="M160,266 H178"/>
  <path class="arrow" d="M320,266 H338"/>
  <path class="arrow" d="M480,266 H498"/>

  <!-- Rejection feedback -->
  <rect x="120" y="330" width="440" height="60" rx="10" fill="#fef2f2" stroke="var(--danger)" stroke-width="2"/>
  <text x="340" y="356" text-anchor="middle" class="req" style="font-weight:700;fill:#b91c1c">❌ Rechazo → feedback específico y accionable</text>
  <text x="340" y="376" text-anchor="middle" class="req" style="fill:#b91c1c;font-size:11px">ej. "Sube una foto con fondo neutro" — nunca un error genérico</text>

  <path class="arrow-danger" d="M300,330 C 230,320 120,300 90,294"/>

  <text x="340" y="416" class="caption" style="fill:#6b7280;font-weight:400">Validación en dos capas: heurística rápida en cliente + verificación estricta en servidor</text>
</svg>
